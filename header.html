<!--
  NIREV header — replaces your existing <header class="topbar"> block.
  Keep your existing IDs/data-attributes where your JS already uses them
  (page title id, sidebar toggle id, user name/avatar ids, sign-out handler).
-->

<header class="topbar" role="banner">

  <!-- Left: menu + breadcrumb + page title -->
  <div class="topbar__left">

    <button class="sidebar-toggle" type="button" aria-label="Open menu" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
    </button>

    <div class="topbar__heading">
      <nav class="topbar__crumbs" aria-label="Breadcrumb">
        <a href="#" data-screen="dashboard">NIREV</a>
        <span class="topbar__crumbs-sep" aria-hidden="true">/</span>
        <span id="topbar-section">Core</span>
      </nav>
      <h1 class="topbar__page-title" id="page-title">Dashboard</h1>
    </div>

  </div>

  <!-- Center: search / command palette trigger -->
  <div class="topbar__center">
    <button class="topbar__search" type="button" id="topbar-search" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <span class="topbar__search-text">Search assessments, reports…</span>
      <kbd class="topbar__kbd">Ctrl K</kbd>
    </button>
  </div>

  <!-- Right: status + actions + account -->
  <div class="topbar__right">

    <div class="topbar__status" role="status">
      <span class="topbar__status-dot" aria-hidden="true"></span>
      AI Online
    </div>

    <button class="topbar__btn topbar__btn--theme" type="button" id="topbar-theme" aria-label="Toggle theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>

    <button class="topbar__btn" type="button" id="topbar-notifications" aria-label="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 20a2 2 0 0 0 3.4 0"/>
      </svg>
      <!-- remove the hidden attribute when there is something unread -->
      <span class="topbar__btn-dot" hidden></span>
    </button>

    <div class="topbar__account">
      <button class="topbar__profile" type="button" id="topbar-profile"
              aria-haspopup="menu" aria-expanded="false" aria-controls="topbar-menu">
        <span class="user-avatar" id="topbar-avatar">NM</span>
        <span class="topbar__profile-name" id="topbar-name">Niki</span>
        <svg class="topbar__chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="m6 9 6 6 6-6"/>
        </svg>
      </button>

      <div class="topbar-menu" id="topbar-menu" role="menu" aria-labelledby="topbar-profile">
        <div class="topbar-menu__head">
          <div class="topbar-menu__name" id="topbar-menu-name">Niki Majidi</div>
          <div class="topbar-menu__email" id="topbar-menu-email">learner</div>
        </div>

        <button class="topbar-menu__item" type="button" role="menuitem" data-screen="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h0a1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
          </svg>
          Settings
        </button>

        <div class="topbar-menu__sep" role="separator"></div>

        <button class="topbar-menu__item topbar-menu__item--danger" type="button" role="menuitem" id="topbar-signout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
          </svg>
          Sign out
        </button>
      </div>
    </div>

  </div>
</header>

<script>
/* Header behavior — drop into your existing JS or keep as is.
   Hooks into your NIREV object; adapt the three TODO lines. */
(() => {
  const topbar  = document.querySelector('.topbar');
  const profile = document.getElementById('topbar-profile');
  const menu    = document.getElementById('topbar-menu');

  // Shadow when the page scrolls
  const onScroll = () => topbar.classList.toggle('is-scrolled', window.scrollY > 6);
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  // Account menu
  const setMenu = open => {
    menu.classList.toggle('open', open);
    profile.setAttribute('aria-expanded', String(open));
  };
  profile.addEventListener('click', e => { e.stopPropagation(); setMenu(!menu.classList.contains('open')); });
  document.addEventListener('click', e => { if (!menu.contains(e.target)) setMenu(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { setMenu(false); profile.focus(); } });

  // Menu navigation
  menu.querySelectorAll('[data-screen]').forEach(b =>
    b.addEventListener('click', () => { setMenu(false); window.NIREV?.navigateTo(b.dataset.screen); }));

  // TODO 1: hook to your existing sign-out
  document.getElementById('topbar-signout')?.addEventListener('click', () => {
    setMenu(false);
    document.dispatchEvent(new CustomEvent('nirev:signout'));
  });

  // TODO 2: hook to your existing theme toggle
  document.getElementById('topbar-theme')?.addEventListener('click', () => {
    const root = document.documentElement;
    const next = root.dataset.theme === 'light' ? 'dark' : 'light';
    root.dataset.theme = next;
    try { localStorage.setItem('nirev-theme', next); } catch (_) {}
  });

  // TODO 3: open your search / command palette
  const openSearch = () => document.dispatchEvent(new CustomEvent('nirev:search:open'));
  document.getElementById('topbar-search')?.addEventListener('click', openSearch);
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); }
  });
})();
</script>
